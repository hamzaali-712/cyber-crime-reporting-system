name: Sync to Hugging Face Space

on:
  push:
    branches: [main]
  force_push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Push to Hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: git push --force https://hamzalali1234:$HF_TOKEN@huggingface.co/spaces/hamzalali1234/ccrs-backend main
